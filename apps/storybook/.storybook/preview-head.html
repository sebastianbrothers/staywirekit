<!-- staywire faces (Fraunces / Inter / JetBrains Mono) ship inside
     @staywirekit/ui via @fontsource imports in fonts.css — no external font
     loading needed here (REGENERATE-PER-BRAND: Graphik-era Google Fonts
     fallback removed). -->
<style>
  /* Theme the whole canvas: addon-themes toggles `.dark` on <html>; --background
     / --foreground come from @staywirekit/ui theme.css and inherit to body. */
  html,
  body {
    min-height: 100%;
    background-color: var(--background);
    color: var(--foreground);
  }
</style>
